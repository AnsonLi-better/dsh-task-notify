  <rect width="1200" height="470" rx="24" fill="#F4F5F7"/>
  <rect x="0.5" y="0.5" width="1199" height="469" rx="23.5" fill="none" stroke="#0F1115" stroke-opacity="0.07"/>

  <text x="48" y="52" fill="#61666B" font-size="16" letter-spacing="3"
        font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">ANATOMY</text>
  <text x="48" y="88" fill="#1B1B1C" font-size="26" font-weight="600">一条通知里放什么</text>

  <!-- ── 放大后的通知卡片 ─────────────────────────── -->
  <g id="specimen">
    <rect x="60" y="128" width="600" height="248" rx="14" fill="#0F1115" fill-opacity="0.06"/>
    <rect x="52" y="120" width="600" height="248" rx="14" fill="#F9F9F9" stroke="#0F1115" stroke-opacity="0.08"/>

    <!-- 应用标识行 -->
    <use href="#whale-a" transform="translate(76 137) scale(1.05)" fill="#1B1B1C" fill-opacity="0.85"/>
    <text x="112" y="153" fill="#61666B" font-size="17">DeepSeek Harness</text>
    <path d="M596 141 l13 13 M609 141 l-13 13" stroke="#61666B" stroke-opacity="0.45" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="72" y1="174" x2="632" y2="174" stroke="#0F1115" stroke-opacity="0.07"/>

    <!-- 状态图标 -->
    <circle cx="102" cy="232" r="24" fill="#E9F8EE"/>
    <g transform="translate(88 218) scale(1.1667)">
      <use href="#tick" fill="none" stroke="#22C55E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 标题 -->
    <text x="146" y="225" fill="#1B1B1C" font-size="24" font-weight="600">任务已完成</text>

    <!-- 正文：三段拼起来 -->
    <text x="146" y="257" fill="#61666B" font-size="18">README 视觉升级</text>
    <text x="320" y="257" fill="#B9BEC5" font-size="18">·</text>
    <text x="336" y="257" fill="#61666B" font-size="18">已重做首屏与流程图</text>
    <text x="530" y="257" fill="#B9BEC5" font-size="18">·</text>
    <text x="546" y="257" fill="#61666B" font-size="18">18 次</text>

    <!-- 按钮 -->
    <rect x="462" y="298" width="76" height="30" rx="6" fill="#0F1115" fill-opacity="0.05"/>
    <text x="500" y="318" fill="#1B1B1C" font-size="16" text-anchor="middle">忽略</text>
    <rect x="548" y="298" width="84" height="30" rx="6" fill="#0F1115" fill-opacity="0.09"/>
    <text x="590" y="318" fill="#1B1B1C" font-size="16" font-weight="600" text-anchor="middle">打开会话</text>
  </g>

  <!-- ── 右侧标注（折线引到各自位置） ───────────────── -->
  <g id="labels">
    <!-- 应用标识 -->
    <path d="M652 148 H676 V145 H700" fill="none" stroke="#C3C8D0" stroke-width="1.5"/>
    <text x="712" y="152" fill="#1B1B1C" font-size="18" font-weight="600">应用标识</text>
    <text x="712" y="176" fill="#5E646B" font-size="16">DSH 鲸鱼标 + 产品名</text>

    <!-- 状态图标 -->
    <path d="M652 232 H676 V231 H700" fill="none" stroke="#C3C8D0" stroke-width="1.5"/>
    <text x="712" y="238" fill="#1B1B1C" font-size="18" font-weight="600">状态图标</text>
    <text x="712" y="262" fill="#5E646B" font-size="16">绿勾 / 红叹号 / 琥珀问号</text>

    <!-- 正文三段 -->
    <path d="M652 257 H676 V315 H700" fill="none" stroke="#C3C8D0" stroke-width="1.5"/>
    <text x="712" y="322" fill="#1B1B1C" font-size="18" font-weight="600">正文三段</text>
    <text x="712" y="346" fill="#5E646B" font-size="16">会话标题 · 收尾总结 · 工具调用数</text>

    <!-- 两个按钮 -->
    <path d="M652 313 H676 V399 H700" fill="none" stroke="#C3C8D0" stroke-width="1.5"/>
    <text x="712" y="406" fill="#1B1B1C" font-size="18" font-weight="600">两个按钮</text>
    <text x="712" y="430" fill="#5E646B" font-size="16">忽略 / 打开会话（回跳原会话）</text>
  </g>
  <text x="48" y="440" fill="#5E646B" font-size="16">正文全部取自已经落盘的会话日志：不发模型请求，不额外花钱，也不拖慢任务。</text>
</svg>
