<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="anatomy-title anatomy-desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="anatomy-title">一条通知的构成</title>
  <desc id="anatomy-desc">放大的一条完成态通知，标注出应用标识行、状态图标、正文（会话标题、模型收尾总结、工具调用数）以及两个按钮。</desc>

