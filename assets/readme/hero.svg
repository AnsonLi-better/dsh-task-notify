    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.46" r="0.52">
      <stop offset="0" stop-color="#1D2C3C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0B0D10" stop-opacity="0"/>
    </radialGradient>
