<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="hero-title hero-desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="hero-title">dsh-task-notify — DeepSeek Harness 的 Windows 任务通知插件</title>
  <desc id="hero-desc">左侧是插件名称与一句话说明；右侧是三条真实渲染的通知卡片，分别表示任务完成、任务中断、等待审批。</desc>

