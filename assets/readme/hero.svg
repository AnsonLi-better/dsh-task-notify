    <path id="glyph-done" d="M5.2,12.4 L9.7,16.9 L18.8,7.6"/>
    <path id="glyph-failed" d="M12,6.6 L12,13.8"/>
    <path id="glyph-approval" d="M8.9,9.1 A3.1,3.1 0 1 1 13.1,12 C12.25,12.35 12,13 12,13.9"/>
  </defs>

  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="500" rx="28" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="499" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <!-- ── 左：身份与承诺 ───────────────────────────── -->
  <g id="copy">
    <text x="64" y="88" fill="#8A93A0" font-size="16" letter-spacing="3.2"
          font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">DSH COMMUNITY PLUGIN · WINDOWS</text>

    <text x="62" y="168" fill="#F2F4F7" font-size="62" font-weight="700" letter-spacing="-1.5">任务通知</text>
    <text x="64" y="208" fill="#8B93A0" font-size="21"
          font-family="ui-monospace, 'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace">dsh-task-notify</text>
    <rect x="64" y="232" width="56" height="2" rx="1" fill="#22C55E"/>

    <text x="64" y="284" fill="#C6CCD6" font-size="23">长任务跑完、失败，或者卡在等你审批，</text>
    <text x="64" y="320" fill="#C6CCD6" font-size="23">Windows 右下角立刻弹一条通知。</text>
    <text x="64" y="358" fill="#7C8593" font-size="18">DSH 最小化、隐藏到托盘、Web 页面关掉，照常出现。</text>

    <circle cx="70" cy="412" r="5" fill="#22C55E"/>
    <text x="86" y="419" fill="#A8AFB9" font-size="18">完成</text>
    <circle cx="196" cy="412" r="5" fill="#EC1313"/>
    <text x="212" y="419" fill="#A8AFB9" font-size="18">失败</text>
    <circle cx="300" cy="412" r="5" fill="#F59E0B"/>
    <text x="316" y="419" fill="#A8AFB9" font-size="18">待审批</text>
  </g>

  <!-- ── 右：三条真实通知 ─────────────────────────── -->
  <g id="toasts">
    <!-- 完成 -->
    <g transform="translate(0 0)">
      <rect x="690" y="48" width="440" height="132" rx="12" fill="#000000" opacity="0.35"/>
      <rect x="690" y="40" width="440" height="132" rx="12" fill="#F9F9F9" stroke="#0F1115" stroke-opacity="0.07"/>
      <use href="#whale" transform="translate(710 55) scale(0.8636)" fill="#1B1B1C" fill-opacity="0.85"/>
      <text x="739" y="67" fill="#61666B" font-size="18">DeepSeek Harness</text>
      <path d="M1108 58 l12 12 M1120 58 l-12 12" stroke="#61666B" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="730" cy="92" r="19" fill="#E9F8EE"/>
      <g transform="translate(719 81) scale(0.9167)">
        <use href="#glyph-done" fill="none" stroke="#22C55E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="762" y="100" fill="#1B1B1C" font-size="23" font-weight="600">任务已完成</text>
      <text x="762" y="127" fill="#61666B" font-size="18">README 视觉升级 · 18 次工具调用</text>
      <rect x="934" y="136" width="64" height="25" rx="5" fill="#0F1115" fill-opacity="0.05"/>
      <text x="966" y="153" fill="#1B1B1C" font-size="16" text-anchor="middle">忽略</text>
      <rect x="1006" y="136" width="104" height="25" rx="5" fill="#0F1115" fill-opacity="0.09"/>
      <text x="1058" y="153" fill="#1B1B1C" font-size="16" font-weight="600" text-anchor="middle">打开会话</text>
    </g>

    <!-- 失败 -->
    <g transform="translate(0 144)">
      <rect x="690" y="48" width="440" height="132" rx="12" fill="#000000" opacity="0.35"/>
      <rect x="690" y="40" width="440" height="132" rx="12" fill="#F9F9F9" stroke="#0F1115" stroke-opacity="0.07"/>
      <use href="#whale" transform="translate(710 55) scale(0.8636)" fill="#1B1B1C" fill-opacity="0.85"/>
      <text x="739" y="67" fill="#61666B" font-size="18">DeepSeek Harness</text>
      <path d="M1108 58 l12 12 M1120 58 l-12 12" stroke="#61666B" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="730" cy="92" r="19" fill="#FDECEC"/>
      <g transform="translate(719 81) scale(0.9167)">
        <use href="#glyph-failed" fill="none" stroke="#EC1313" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="12" cy="17.6" r="1.35" fill="#EC1313"/>
      </g>
      <text x="762" y="100" fill="#1B1B1C" font-size="23" font-weight="600">任务中断</text>
      <text x="762" y="127" fill="#61666B" font-size="18">README 重排 · 原因：上下文超限</text>
      <rect x="934" y="136" width="64" height="25" rx="5" fill="#0F1115" fill-opacity="0.05"/>
      <text x="966" y="153" fill="#1B1B1C" font-size="16" text-anchor="middle">忽略</text>
      <rect x="1006" y="136" width="104" height="25" rx="5" fill="#0F1115" fill-opacity="0.09"/>
      <text x="1058" y="153" fill="#1B1B1C" font-size="16" font-weight="600" text-anchor="middle">查看原因</text>
    </g>

    <!-- 待审批 -->
    <g transform="translate(0 288)">
      <rect x="690" y="48" width="440" height="132" rx="12" fill="#000000" opacity="0.35"/>
      <rect x="690" y="40" width="440" height="132" rx="12" fill="#F9F9F9" stroke="#0F1115" stroke-opacity="0.07"/>
      <use href="#whale" transform="translate(710 55) scale(0.8636)" fill="#1B1B1C" fill-opacity="0.85"/>
      <text x="739" y="67" fill="#61666B" font-size="18">DeepSeek Harness</text>
      <path d="M1108 58 l12 12 M1120 58 l-12 12" stroke="#61666B" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="730" cy="92" r="19" fill="#FEF4E4"/>
      <g transform="translate(719 81) scale(0.9167)">
        <use href="#glyph-approval" fill="none" stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="17.7" r="1.35" fill="#F59E0B"/>
      </g>
      <text x="762" y="100" fill="#1B1B1C" font-size="23" font-weight="600">等待你的确认</text>
      <text x="762" y="127" fill="#61666B" font-size="18">shell · 需要你批准后继续</text>
      <rect x="934" y="136" width="64" height="25" rx="5" fill="#0F1115" fill-opacity="0.05"/>
      <text x="966" y="153" fill="#1B1B1C" font-size="16" text-anchor="middle">稍后</text>
      <rect x="1006" y="136" width="104" height="25" rx="5" fill="#0F1115" fill-opacity="0.09"/>
      <text x="1058" y="153" fill="#1B1B1C" font-size="16" font-weight="600" text-anchor="middle">立即处理</text>
    </g>
  </g>
</svg>
